name: placemarket-staging

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - staging_mongo:/data/db
    environment:
      MONGO_INITDB_DATABASE: placemarket

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.staging
    environment:
      MONGODB_URI: mongodb://mongo:27017/placemarket
      NODE_ENV: staging
      PORT: "3000"
      CORS_ORIGINS: "*"
    depends_on:
      - mongo
    ports:
      - "3010:3000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

  holder:
    build: ./holder
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8082:80"

volumes:
  staging_mongo:
