<div class="w">
  <app-page-bar [title]="('checkout' | t)" />
  <form class="panel auth" (submit)="submit($event)">
    @if (error) {
      <div class="error">{{ error }}</div>
    }
    <div class="row-h">
      <b>{{ 'addresses' | t }}</b>
      <a routerLink="/addresses">{{ 'manageAddresses' | t }}</a>
    </div>
    @if (addresses().length) {
      @for (a of addresses(); track a._id || a.id) {
        <label class="addr" [class.on]="addressId === (a._id || a.id)">
          <input type="radio" name="addressId" [value]="a._id || a.id" [(ngModel)]="addressId" />
          <div>
            <strong>{{ a.label || ('addresses' | t) }}</strong>
            <div class="muted">{{ a.fullName }} · {{ a.city }} · {{ a.street }}</div>
          </div>
        </label>
      }
    } @else {
      <p class="muted">
        {{ 'noAddresses' | t }}
        <a routerLink="/address">{{ 'addAddress' | t }}</a>
      </p>
    }
    <div class="field">
      <label>{{ 'notes' | t }}</label>
      <input [(ngModel)]="notes" name="notes" />
    </div>
    <div class="cod">💵 {{ 'cod' | t }}</div>
    <button class="btn wide" type="submit">{{ 'placeOrder' | t }}</button>
  </form>
</div>
