<div class="w narrow page">
  <app-page-bar [title]="(id ? ('editAddress' | t) : ('addAddress' | t))" />
  <form class="panel form-panel m-enter" (submit)="submit($event)">
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    <app-map-picker [lat]="lat" [lng]="lng" (coordsChange)="onCoords($event)" />
    <div class="form-grid two">
      <div class="field">
        <label for="af-label">{{ 'label' | t }}</label>
        <input id="af-label" [(ngModel)]="label" name="label" />
      </div>
      <div class="field">
        <label for="af-name">{{ 'name' | t }}</label>
        <input id="af-name" [(ngModel)]="fullName" name="fullName" required />
      </div>
      <div class="field">
        <label for="af-phone">{{ 'phone' | t }}</label>
        <input id="af-phone" type="tel" [(ngModel)]="phone" name="phone" required />
      </div>
      <div class="field">
        <label for="af-city">{{ 'city' | t }}</label>
        <input id="af-city" [(ngModel)]="city" name="city" required />
      </div>
    </div>
    <div class="field">
      <label for="af-street">{{ 'street' | t }}</label>
      <input id="af-street" [(ngModel)]="street" name="street" required />
    </div>
    <div class="field">
      <label for="af-notes">{{ 'notes' | t }}</label>
      <input id="af-notes" [(ngModel)]="notes" name="notes" />
    </div>
    <label class="chk">
      <input type="checkbox" [(ngModel)]="isDefault" name="isDefault" />
      {{ 'defaultAddress' | t }}
    </label>
    <button class="btn wide" type="submit">{{ 'saved' | t }}</button>
  </form>
</div>
