<div class="w">
  <app-page-bar [title]="('addresses' | t)" />
  <p style="margin-bottom: 16px">
    <a class="btn" routerLink="/address">{{ 'addAddress' | t }}</a>
  </p>
  <app-async-state
    [loading]="loading()"
    [error]="error()"
    [empty]="!addresses().length"
    emptyKey="noAddresses"
    (retry)="load()"
  />
  @if (!loading()) {
    @for (a of addresses(); track aid(a)) {
      <div class="order-card">
        <div>
          <strong>
            {{ a.label || ('addresses' | t) }}
            @if (a.isDefault) {
              · {{ 'defaultAddress' | t }}
            }
          </strong>
          <div class="muted">{{ a.fullName }} · {{ a.phone }}</div>
          <div>{{ a.street }} · {{ a.city }}</div>
        </div>
        <div class="row-h">
          <a [routerLink]="['/address', aid(a)]">{{ 'editAddress' | t }}</a>
          @if (!a.isDefault) {
            <button class="btn ghost-btn" type="button" (click)="setDefault(aid(a))">{{ 'setDefault' | t }}</button>
          }
          <button class="btn ghost-btn" type="button" (click)="remove(aid(a))">{{ 'delete' | t }}</button>
        </div>
      </div>
    }
  }
</div>
