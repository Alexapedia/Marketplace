<div class="w">
  <form class="panel auth" (submit)="submit($event)">
    <h1>{{ 'forgotPassword' | t }}</h1>
    <p class="muted">{{ 'forgotHint' | t }}</p>
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    @if (sent()) {
      <div class="cod">{{ 'forgotSent' | t }}</div>
    }
    <div class="field">
      <label>{{ 'email' | t }}</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>
    <button class="btn wide" type="submit">{{ 'sendReset' | t }}</button>
    <p class="muted" style="text-align: center; margin-top: 14px">
      <a routerLink="/login">{{ 'login' | t }}</a>
      ·
      <a routerLink="/reset">{{ 'resetPassword' | t }}</a>
    </p>
  </form>
</div>
