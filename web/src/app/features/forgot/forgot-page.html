<app-auth-layout mode="forgot">
  <form class="auth-form" (submit)="submit($event)">
    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }
    @if (sent()) {
      <div class="auth-ok">{{ 'forgotSent' | t }}</div>
    } @else {
      <div class="auth-field">
        <label for="auth-email">{{ 'email' | t }}</label>
        <input
          id="auth-email"
          type="email"
          name="email"
          autocomplete="email"
          [(ngModel)]="email"
          required
        />
      </div>
      <button class="auth-btn" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="auth-spin"></span>
        } @else {
          {{ 'sendReset' | t }}
        }
      </button>
    }
  </form>
</app-auth-layout>
