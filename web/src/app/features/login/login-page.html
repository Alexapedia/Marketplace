<div class="w">
  <form class="panel auth" (submit)="submit($event)">
    <h1>{{ 'login' | t }}</h1>
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    <div class="field">
      <label>{{ 'email' | t }}</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>
    <div class="field">
      <label>{{ 'password' | t }}</label>
      <input type="password" [(ngModel)]="password" name="password" required />
    </div>
    <button class="btn wide" type="submit">{{ 'login' | t }}</button>
    <p class="muted" style="text-align: center; margin-top: 14px">
      <a routerLink="/register">{{ 'register' | t }}</a>
      ·
      <a routerLink="/forgot">{{ 'forgotPassword' | t }}</a>
    </p>
  </form>
</div>
