<app-auth-layout mode="login">
  <form class="auth-form" (submit)="submit($event)">
    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }
    <div class="auth-field">
      <label for="auth-email">{{ 'email' | t }}</label>
      <input
        id="auth-email"
        type="email"
        name="email"
        autocomplete="username"
        [(ngModel)]="email"
        required
      />
    </div>
    <div class="auth-field">
      <div class="auth-label-row">
        <label for="auth-password">{{ 'password' | t }}</label>
        <a routerLink="/forgot">{{ 'forgotPassword' | t }}</a>
      </div>
      <div class="auth-pass">
        <input
          id="auth-password"
          [type]="hide() ? 'password' : 'text'"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
        />
        <app-auth-eye [masked]="hide()" (toggle)="hide.set(!hide())" />
      </div>
    </div>
    <button class="auth-btn" type="submit" [disabled]="loading()">
      @if (loading()) {
        <span class="auth-spin"></span>
      } @else {
        {{ 'login' | t }}
      }
    </button>
  </form>
</app-auth-layout>
