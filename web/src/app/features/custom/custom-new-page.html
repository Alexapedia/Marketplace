<div class="w">
  <app-page-bar [title]="('startCustom' | t)" />
  <form class="panel auth" (submit)="submit($event)">
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    <div class="field">
      <label>{{ 'pickCategory' | t }}</label>
      <select [(ngModel)]="categoryId" name="categoryId" required (ngModelChange)="onCategoryChange()">
        <option value="">{{ 'pickCategory' | t }}</option>
        @for (c of cats(); track trackCat(c)) {
          <option [value]="c._id || c.id">{{ c.names || c.name | loc }}</option>
        }
      </select>
    </div>

    @for (f of fields(); track f._id || f.id) {
      <div class="field">
        <label>{{ fieldLabel(f) }}{{ f.required ? ' *' : '' }}</label>
        @switch (f.fieldType) {
          @case ('textarea') {
            <textarea [(ngModel)]="fieldValues[f._id || f.id || '']" [name]="'f_' + f._id"></textarea>
          }
          @case ('dropdown') {
            <select [(ngModel)]="fieldValues[f._id || f.id || '']" [name]="'f_' + f._id">
              <option value=""></option>
              @for (opt of f.options || []; track opt) {
                <option [value]="opt">{{ opt }}</option>
              }
            </select>
          }
          @case ('boolean') {
            <label class="chk">
              <input type="checkbox" [(ngModel)]="fieldValues[f._id || f.id || '']" [name]="'f_' + f._id" />
              {{ fieldLabel(f) }}
            </label>
          }
          @case ('number') {
            <input type="number" [(ngModel)]="fieldValues[f._id || f.id || '']" [name]="'f_' + f._id" />
          }
          @default {
            <input [(ngModel)]="fieldValues[f._id || f.id || '']" [name]="'f_' + f._id" />
          }
        }
      </div>
    }

    <div class="field">
      <label>{{ 'description' | t }}</label>
      <textarea [(ngModel)]="description" name="description" required [placeholder]="'notes' | t"></textarea>
    </div>

    <div class="field">
      <label>{{ 'attachments' | t }}</label>
      <input type="file" multiple accept="image/*" (change)="onFiles($event)" />
    </div>

    <button class="btn wide" type="submit">{{ 'submitCustom' | t }}</button>
  </form>
</div>
