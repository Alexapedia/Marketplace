<div class="w">
  <app-page-bar [title]="('customOrders' | t)" />
  <p style="margin-bottom: 16px">
    <a class="btn" routerLink="/custom/new">{{ 'startCustom' | t }}</a>
  </p>
  @if (!list.loading()) {
    @for (o of list.items(); track o._id) {
      <a class="order-card" [routerLink]="['/custom', o._id]">
        <div>
          <strong>{{ title(o) }}</strong>
          <div class="muted">
            {{ o.description || '' }}
            @if (o.createdAt) { · {{ o.createdAt | date: 'mediumDate' : undefined : i18n.lang() }} }
          </div>
        </div>
        <span class="status-pill">{{ ('cstatus_' + o.status) | t }}</span>
      </a>
    }
    <app-load-more [show]="list.hasMore()" [busy]="list.loadingMore()" (more)="list.more()" />
  }
  <app-async-state
    [loading]="list.loading()"
    [error]="list.error()"
    [empty]="!list.items().length"
    emptyKey="emptyCustom"
    (retry)="list.reload()"
  />
</div>
