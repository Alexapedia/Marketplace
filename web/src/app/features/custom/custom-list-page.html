<div class="w narrow page">
  <app-page-bar [title]="('customOrders' | t)" />
  <div class="list-tools">
    <a class="btn" routerLink="/custom/new"><m-icon name="spark" />{{ 'startCustom' | t }}</a>
  </div>
  @if (!list.loading()) {
    <div class="rows">
      @for (o of list.items(); track o._id; let n = $index) {
        <a class="order-card m-press" [mReveal]="n % 8" [routerLink]="['/custom', o._id]">
          <span class="row-ico"><m-icon name="spark" /></span>
          <div class="row-main">
            <strong>{{ title(o) }}</strong>
            <div class="muted clamp-1">
              {{ o.description || '' }}
              @if (o.createdAt) { · {{ o.createdAt | date: 'mediumDate' : undefined : i18n.lang() }} }
            </div>
          </div>
          <span class="status-pill" [attr.data-s]="o.status">{{ ('cstatus_' + o.status) | t }}</span>
          <m-icon name="chevron" class="row-chev m-flip" />
        </a>
      }
    </div>
    <app-load-more [show]="list.hasMore()" [busy]="list.loadingMore()" (more)="list.more()" />
  }
  <app-async-state
    [loading]="list.loading()"
    [error]="list.error()"
    [empty]="!list.items().length"
    emptyKey="emptyCustom"
    (retry)="list.reload()"
  />
</div>
