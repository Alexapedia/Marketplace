<div class="w">
  <app-page-bar [title]="('notifications' | t)" />
  @if (hasUnread()) {
    <p class="row-actions">
      <button class="btn ghost-btn" type="button" (click)="markAllRead()">{{ 'markAllRead' | t }}</button>
    </p>
  }
  @if (!list.loading()) {
    @for (n of list.items(); track idOf(n)) {
      <div class="order-card notif" [class.read]="!!n.readAt">
        <div>
          <strong>{{ title(n) }}</strong>
          <div>{{ body(n) }}</div>
          @if (n.createdAt) {
            <small class="muted">{{ n.createdAt | date: 'medium' : undefined : i18n.lang() }}</small>
          }
        </div>
        <div class="row-actions">
          @if (!n.readAt) {
            <button class="btn" type="button" (click)="markRead(n)">{{ 'markRead' | t }}</button>
          }
          <button class="icon-btn" type="button" (click)="remove(n)" [attr.aria-label]="'delete' | t" [title]="'delete' | t">✕</button>
        </div>
      </div>
    }
    <app-load-more [show]="list.hasMore()" [busy]="list.loadingMore()" (more)="list.more()" />
  }
  <app-async-state
    [loading]="list.loading()"
    [error]="list.error()"
    [empty]="!list.items().length"
    emptyKey="emptyNotifications"
    (retry)="list.reload()"
  />
</div>
