<div class="login">
  <aside class="hero">
    <div class="hero-inner">
      <div class="mark">Z</div>
      <h1>{{ 'brand' | t }}</h1>
      <p>{{ 'login.hero' | t }}</p>
    </div>
  </aside>

  <section class="panel-wrap">
    <button class="lang" type="button" (click)="i18n.toggle()">
      {{ i18n.lang() === 'en' ? 'العربية' : 'English' }}
    </button>
    <div class="panel">
      <p class="kicker">{{ 'brandSub' | t }}</p>
      <h2>{{ 'login.title' | t }}</h2>
      <p class="sub">{{ 'login.subtitle' | t }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full">
          <mat-label>{{ 'login.email' | t }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          <mat-icon matPrefix>mail_outline</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>{{ 'login.password' | t }}</mat-label>
          <input
            matInput
            [type]="hide() ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <mat-icon matPrefix>lock_outline</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="hide.set(!hide())">
            <mat-icon>{{ hide() ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error()) {
          <div class="error">{{ error() }}</div>
        }

        <button mat-flat-button class="submit" type="submit" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="18" />
          } @else {
            {{ 'login.submit' | t }}
          }
        </button>
        <p class="hint">{{ 'login.hint' | t }}</p>
      </form>
    </div>
  </section>
</div>
