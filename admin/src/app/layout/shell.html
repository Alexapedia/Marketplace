<mat-sidenav-container class="shell">
  <mat-sidenav
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpened.set($event)"
    class="sidenav"
  >
    <div class="brand">
      <div class="mark">P</div>
      <div>
        <div class="brand-name">{{ 'brand' | t }}</div>
        <div class="brand-sub">{{ 'brandSub' | t }}</div>
      </div>
    </div>
    <mat-nav-list>
      @for (item of visibleNav(); track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active"
          (click)="closeIfOverlay()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.labelKey | t }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <button mat-icon-button (click)="toggleNav()" aria-label="Menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="page-title">{{ pageTitle() | t }}</span>
      <span class="spacer"></span>
      <button mat-button (click)="i18n.toggle()">
        {{ i18n.lang() === 'en' ? 'العربية' : 'English' }}
      </button>
      <button
        mat-icon-button
        (click)="theme.toggle()"
        [matTooltip]="'common.theme' | t"
      >
        <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-meta">{{ auth.user()?.name }}</div>
        <div class="user-meta muted">{{ auth.user()?.email }}</div>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>{{ 'common.logout' | t }}</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
