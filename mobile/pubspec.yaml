name: placemarket_mobile
description: "PlaceMarket customer mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.8.0+1
  get_it: ^8.0.3
  go_router: ^16.0.0
  easy_localization: ^3.0.8
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  flutter_svg: ^2.1.0
  flutter_animate: ^4.5.2
  skeletonizer: ^2.0.1
  image_picker: ^1.1.2
  dartz: ^0.10.1
  google_sign_in: ^6.3.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.4
  intl: any
  smooth_page_indicator: ^1.2.1
  photo_view: ^0.15.0
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
