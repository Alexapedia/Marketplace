# Production stack. Run from this folder:
#   Platform (you, many stores):  docker compose --profile platform up -d --build
#   Single store (a buyer):       docker compose up -d --build
# Settings live in deploy/.env (copy .env.example). See docs/production.md.
name: placemarket

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in deploy/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in deploy/.env}
    volumes:
      - mongo_data:/data/db
    # Not published: only the api reaches it, on the internal network.

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/placemarket?authSource=admin
      API_HOSTS: ${API_HOSTS:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo

  web:
    build: ../web
    restart: unless-stopped
    depends_on:
      - api

  admin:
    build: ../admin
    restart: unless-stopped
    depends_on:
      - api

  holder:
    build: ../holder
    restart: unless-stopped
    profiles: ["platform"]
    depends_on:
      - api

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_HOST: ${API_HOST:?set API_HOST in deploy/.env}
      HOLDER_HOST: ${HOLDER_HOST:-holder.invalid}
    volumes:
      - ./proxy/templates:/etc/nginx/templates:ro
      - ./proxy/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      - ./proxy/clients:/etc/nginx/clients:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
      - admin

volumes:
  mongo_data:
  uploads:
